# Deployment compose (Traefik VPS convention): pulls the GHCR image published by
# .github/workflows/playground-docker.yml and routes it through the external
# `web` network's Traefik instance. For a local build instead, use:
#   docker compose -f docker-compose.local.yml up
#
# The named volume keeps trained models + the public gallery across restarts and
# upgrades; a fresh volume seeds itself from the image's baked-in pre-trained
# checkpoints, so the playground is instantly ready.
services:
  playground:
    image: ghcr.io/mintplayer/mintplayer.ai.reinforcementlearning/playground:master
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rl-playground.rule=Host(`rl.mintplayer.com`)"
      - "traefik.http.routers.rl-playground.entrypoints=websecure"
      - "traefik.http.routers.rl-playground.tls.certresolver=letsencrypt"
      - "traefik.http.services.rl-playground.loadbalancer.server.port=8080"
    volumes:
      - playground-data:/data
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true

volumes:
  playground-data:
