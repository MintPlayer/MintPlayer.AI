name: pull-request

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: pull-request
    runs-on: ubuntu-latest

    # id-token: the coverage upload authenticates via GitHub OIDC (tokenless — the repo is
    # public, so coverage.mintplayer.com auto-provisions it; no COVERAGE_TOKEN secret needed).
    # packages: read — `dotnet restore` pulls from GPR with github.token.
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:EnableSpaBuilder=false

    - name: Test
      # --no-build (already here since #43's timing pass) is what keeps coverage honest AND fast:
      # without it dotnet test silently rebuilds and measures that second build instead of the
      # Release binaries built above (Dotnet.Tools measured 88s -> 32s from this flag alone).
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, hence the ** in the upload glob below.
      run: >
        dotnet test --configuration Release --no-build --filter "Category!=Slow" --verbosity normal
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    # Nothing here gates the merge — the service publishes the `coverage/project` and
    # `coverage/patch` check runs itself; branch protection can require those.
    #
    # Placed before the Angular build: upload as soon as the report exists, so a broken
    # ClientApp doesn't cost the coverage datapoint.
    - name: Upload coverage
      # Fork PRs get neither secrets nor an OIDC token, so the upload cannot work there. Skip
      # rather than fail — a contributor's PR must not go red over that.
      # hashFiles guard: a run that produced no report is a no-op, not an upload of nothing.
      if: >
        github.event.pull_request.head.repo.full_name == github.repository
        && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        use-oidc: true
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to auto-detection
        # and would upload stray unparsable reports.
        disable-search: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # NOT finished here (M63.7): the TypeScript report below uploads under the same
        # (repo, sha, runId, runAttempt) and the service merges the two with max semantics, which
        # is what gives each .pg line the union of its C# and TS hits. Finishing now would close
        # the build before the second report arrived. The LAST upload finishes.
        finish: false
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false

    # The .NET steps skip the SPA (EnableSpaBuilder=false). Build the Angular app explicitly so a
    # broken ClientApp fails the PR — not the post-merge Docker build. Same command prod ships
    # (Dockerfile stage 1 `npm run build`), on the same Node major (node:22-alpine).
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/RLDemo.Web/ClientApp/package-lock.json

    - name: Build Angular app
      working-directory: src/RLDemo.Web/ClientApp
      run: npm ci && npm run build

    # M63.7 -- the TypeScript half of the .pg coverage union.
    #
    # The solver twins are transpiled from the same .pg files the backend compiles, so covering them
    # here and projecting the result back onto the .pg is what makes a line read as covered when
    # EITHER target exercised it. Vitest runs in Node (no browser), so this is ~25s.
    - name: Test Angular app
      working-directory: src/RLDemo.Web/ClientApp
      run: npm run test:coverage

    # istanbul reports against the generated *_solver.ts. This composes that through the Polyglot
    # .ts.map (emitted by PolyglotOriginInfo=true) onto the .pg, which IS in git ls-files and so is
    # resolvable by the coverage service. Done as a post-process because @angular/build:unit-test
    # pre-builds with esbuild before Vitest starts, so a Vite plugin feeding the map in as an input
    # map is never consulted (PRD section 6, spike S5).
    - name: Project TypeScript coverage onto the .pg sources
      run: >
        node tools/pg_coverage_remap.mjs
        src/RLDemo.Web/ClientApp/coverage/ClientApp/coverage-final.json
        coverage-ts/pg.cobertura.xml
        .

    - name: Upload TypeScript coverage
      # always(): a failure in a LATER step must not cost this datapoint, and the hashFiles guard
      # makes a run that produced no report a no-op rather than an upload of nothing. If the remap
      # never ran, this is skipped and the build finalizes on the service's own debounce instead.
      if: >
        always()
        && github.event.pull_request.head.repo.full_name == github.repository
        && hashFiles('coverage-ts/pg.cobertura.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        use-oidc: true
        files: |
          coverage-ts/pg.cobertura.xml
        disable-search: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # The last upload of the build closes it.
        finish: true
        fail-ci-if-error: false
