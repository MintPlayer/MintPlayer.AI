name: pull-request

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: pull-request
    runs-on: ubuntu-latest

    # id-token: the coverage upload authenticates via GitHub OIDC (tokenless — the repo is
    # public, so coverage.mintplayer.com auto-provisions it; no COVERAGE_TOKEN secret needed).
    # packages: read — `dotnet restore` pulls from GPR with github.token.
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:EnableSpaBuilder=false

    - name: Test
      # --no-build (already here since #43's timing pass) is what keeps coverage honest AND fast:
      # without it dotnet test silently rebuilds and measures that second build instead of the
      # Release binaries built above (Dotnet.Tools measured 88s -> 32s from this flag alone).
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, hence the ** in the upload glob below.
      run: >
        dotnet test --configuration Release --no-build --filter "Category!=Slow&Category!=Determinism" --verbosity normal
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    # M64.0c -- the bitwise-identity gate. Runs UNINSTRUMENTED and separately from the coverage
    # bucket: these compare checkpoint bytes against checked-in hash literals, so instrumentation
    # would cost time and change nothing. Until now this gate existed only as Slow-tagged tests that
    # CI never ran, which meant a change breaking training reproducibility shipped green.
    #
    # A failure here is NOT a flake. It means the trained bytes moved. Either that was intended (a
    # deliberate change to the training recipe -- update the literal and say so in the commit) or it
    # is exactly the regression this step exists to catch.
    - name: Determinism gate
      run: >
        dotnet test --configuration Release --no-build --filter "Category=Determinism"
        --verbosity normal

    # Nothing here gates the merge — the service publishes the `coverage/project` and
    # `coverage/patch` check runs itself; branch protection can require those.
    #
    # Placed before the Angular build: upload as soon as the report exists, so a broken
    # ClientApp doesn't cost the coverage datapoint.
    - name: Upload coverage
      # Fork PRs get neither secrets nor an OIDC token, so the upload cannot work there. Skip
      # rather than fail — a contributor's PR must not go red over that.
      # hashFiles guard: a run that produced no report is a no-op, not an upload of nothing.
      if: >
        github.event.pull_request.head.repo.full_name == github.repository
        && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        use-oidc: true
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to auto-detection
        # and would upload stray unparsable reports.
        disable-search: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # M64: the C# report is the only one again, so it closes the build. The TypeScript ->.pg
        # projection was measured at +0.1pp for +57s and removed -- see the note on the Angular test
        # step below.
        finish: true
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false

    # The .NET steps skip the SPA (EnableSpaBuilder=false). Build the Angular app explicitly so a
    # broken ClientApp fails the PR — not the post-merge Docker build. Same command prod ships
    # (Dockerfile stage 1 `npm run build`), on the same Node major (node:22-alpine).
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/RLDemo.Web/ClientApp/package-lock.json

    - name: Build Angular app
      working-directory: src/RLDemo.Web/ClientApp
      run: npm ci && npm run build

    # The frontend suite. It does NOT feed coverage, deliberately.
    #
    # M63.7 projected this run's coverage back onto the .pg sources and uploaded it as a second
    # report. Measured, that bought +0.1pp for +57s of CI -- because the C# side ALREADY covers those
    # same .pg lines at 93.9% through the #line pragmas, so the two reports were double-counting one
    # source file. (Not quite zero: istanbul's statement view reached ~12 .pg lines the C# sequence
    # points did not. Not 57 seconds' worth.)
    #
    # The tests themselves stay, and are worth keeping without the upload: they are the only thing
    # that would catch a Polyglot TypeScript codegen regression, which the C# side structurally
    # cannot see.
    #
    # tools/pg_coverage_remap.mjs is retained -- it is the working implementation if the hand-written
    # ClientApp code ever gains enough specs to make frontend coverage worth uploading. At that point
    # the report should cover the HAND-WRITTEN app (components, services), not the generated twins.
    - name: Test Angular app
      working-directory: src/RLDemo.Web/ClientApp
      run: npm run test:coverage
