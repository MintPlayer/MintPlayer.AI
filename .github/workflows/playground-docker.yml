name: playground-docker

on:
  push:
    branches:
      - master
    paths:
      # Everything the image is built from (see Dockerfile + .dockerignore):
      - 'src/**'
      - 'models/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'MintPlayer.AI.ReinforcementLearning.sln'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/playground

jobs:
  build-and-push:

    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # No host .NET/Node setup needed: the Dockerfile's stages run `npm ci`,
    # `npm run build`, `dotnet restore` and `dotnet publish` inside the
    # container. Build/test failures are already gated upstream by
    # pull-request.yml (pre-merge) and build-master.yml (post-merge, runs in
    # parallel with this job).
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate with GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract tags/labels
      id: meta-ghcr
      uses: docker/metadata-action@v5
      with:
        github-token: ${{ github.token }}
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Build and push Docker image
      id: push-ghcr
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-ghcr.outputs.tags }}
        labels: ${{ steps.meta-ghcr.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push-ghcr.outputs.digest }}
        push-to-registry: true
