name: playground-docker

on:
  push:
    branches:
      - master
    paths:
      # Everything the image is built from (see Dockerfile + .dockerignore),
      # plus the deployment inputs themselves:
      - 'src/**'
      - 'models/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'MintPlayer.AI.ReinforcementLearning.sln'
      - 'docker-compose.yml'
      - '.github/workflows/playground-docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/playground
  APP_NAME: mintplayer-ai

jobs:
  build-and-push:

    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      # Fetch the actual model checkpoints (Git LFS), not pointer files — the Dockerfile COPYs
      # models/ into the image as the seed, and .dockerignore excludes .git so LFS cannot be
      # resolved inside the build. Without this the self-taught net would ship as a 130-byte pointer.
      with:
        lfs: true

    # No host .NET/Node setup needed: the Dockerfile's stages run `npm ci`,
    # `npm run build`, `dotnet restore` and `dotnet publish` inside the
    # container. Build/test failures are already gated upstream by
    # pull-request.yml (pre-merge) and build-master.yml (post-merge, runs in
    # parallel with this job).
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Authenticate with GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract tags/labels
      id: meta-ghcr
      uses: docker/metadata-action@v6
      with:
        github-token: ${{ github.token }}
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Build and push Docker image
      id: push-ghcr
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-ghcr.outputs.tags }}
        labels: ${{ steps.meta-ghcr.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push-ghcr.outputs.digest }}
        push-to-registry: true

    # GHCR packages default to private on first publish — the VPS `docker compose
    # pull` would fail with 'denied'. PATCH is idempotent (already-public → 204);
    # errors are swallowed so a missing scope doesn't fail the workflow. The '/'
    # in the package name must be percent-encoded for the org-packages API.
    - name: Make GHCR image public
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api --method PATCH \
          "/orgs/${{ github.repository_owner }}/packages/container/mintplayer.ai%2Fplayground" \
          -f visibility=public 2>&1 || echo "(skipped — already public, missing, or insufficient scope)"

  deploy:

    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: read

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
        envs: GITHUB_TOKEN
        script: |
          mkdir -p /var/www/${{ env.APP_NAME }}
          cd /var/www/${{ env.APP_NAME }}

          # Generate .env from GitHub Secrets (ready for future secrets)
          cat > .env << EOF
          # Future secrets go here, e.g.:
          # SECRET_KEY=value
          EOF

          # Download latest docker-compose.yml from the repository
          rm -f docker-compose.yml
          curl -sf -H "Authorization: token $GITHUB_TOKEN" -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/master/docker-compose.yml

          # Log in to GHCR using the workflow's GITHUB_TOKEN
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Pull latest image
          docker compose --env-file .env pull

          # Stop and remove old containers (including any orphans from prior service renames)
          docker compose --env-file .env down --remove-orphans

          # Start new containers
          docker compose --env-file .env up -d --remove-orphans

          # Clean up old images
          docker image prune -f
