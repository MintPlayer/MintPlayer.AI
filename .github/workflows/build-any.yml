name: build-any

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!release/**'

jobs:
  build:

    name: build-any
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    # EnableSpaBuilder=false: the Angular bundle is not needed to build/test the
    # libraries (the Testing host serves no SPA), so skip npm entirely in CI.
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:EnableSpaBuilder=false

    # Slow-bucket tests train models for many minutes; they are opt-in locally.
    - name: Test
      run: dotnet test --configuration Release --no-build --filter "Category!=Slow" --verbosity normal
