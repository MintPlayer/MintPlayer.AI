name: build-master

on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    name: build-master
    runs-on: ubuntu-latest

    # id-token: the coverage upload authenticates via GitHub OIDC (tokenless — the repo is
    # public, so coverage.mintplayer.com auto-provisions it; no COVERAGE_TOKEN secret needed),
    # and the NuGet login exchanges the same OIDC token for a short-lived nuget.org API key.
    # packages: write — PushGithub pushes nupkgs to GPR with github.token.
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:EnableSpaBuilder=false

    - name: Test
      # --no-build (already here since #43's timing pass) is what keeps coverage honest AND fast:
      # without it dotnet test silently rebuilds and measures that second build instead of the
      # Release binaries built above (Dotnet.Tools measured 88s -> 32s from this flag alone).
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, hence the ** in the upload glob below.
      run: >
        dotnet test --configuration Release --no-build --filter "Category!=Slow&Category!=Determinism" --verbosity normal
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    # M64.0c -- the bitwise-identity gate. Runs UNINSTRUMENTED and separately from the coverage
    # bucket: these compare checkpoint bytes against checked-in hash literals, so instrumentation
    # would cost time and change nothing. Until now this gate existed only as Slow-tagged tests that
    # CI never ran, which meant a change breaking training reproducibility shipped green.
    #
    # A failure here is NOT a flake. It means the trained bytes moved. Either that was intended (a
    # deliberate change to the training recipe -- update the literal and say so in the commit) or it
    # is exactly the regression this step exists to catch.
    - name: Determinism gate
      run: >
        dotnet test --configuration Release --no-build --filter "Category=Determinism"
        --verbosity normal

    - name: Upload coverage
      # always(): a Test failure must still not lose the datapoint (if a report was written).
      # hashFiles guard: a run that produced no report is a no-op, not an upload of nothing.
      if: always() && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        use-oidc: true
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to auto-detection
        # and would upload stray unparsable reports.
        disable-search: true
        # M65: the frontend uploads a second report under the same (repo, sha, runId, runAttempt) and
        # the service merges them, so this one no longer closes the build -- the last upload does.
        finish: false
        # A coverage-service outage must never block a NuGet release.
        fail-ci-if-error: false

    # M65: master must measure the SAME thing a PR does, or the badge and the PR number disagree for
    # reasons that have nothing to do with the code. That is worth ~a minute on the release path.
    # Scope and rationale: see the matching block in pull-request.yml.
    - name: Setup Node
      if: always()
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/RLDemo.Web/ClientApp/package-lock.json

    - name: Test Angular app
      if: always()
      working-directory: src/RLDemo.Web/ClientApp
      run: npm ci && npm run test:coverage

    - name: Re-root the frontend coverage paths
      if: always()
      working-directory: src/RLDemo.Web/ClientApp
      run: node ../../../tools/reroot_frontend_coverage.mjs coverage/ClientApp/cobertura-coverage.xml src/RLDemo.Web/ClientApp

    # The .pg union: the twins' coverage projected back onto their .pg sources through Polyglot's v3
    # source maps, by `polyglot coverage remap` from the restored MSBuild package (M67).
    # Rationale, and why --out-format is pinned to cobertura: see pull-request.yml.
    - name: Locate the Polyglot CLI
      if: always()
      id: polyglot
      run: |
        TOOL=$(find "$HOME/.nuget/packages/mintplayer.polyglot.msbuild" -path '*/tools/linux-x64/polyglot' -type f | sort -V | tail -1)
        if [ -z "$TOOL" ]; then echo "::error::polyglot CLI not found in the restored package"; exit 1; fi
        chmod +x "$TOOL"
        echo "tool=$TOOL" >> "$GITHUB_OUTPUT"

    - name: Project the Polyglot twins onto their .pg sources
      if: always()
      run: >
        "${{ steps.polyglot.outputs.tool }}" coverage remap
        src/RLDemo.Web/ClientApp/coverage/ClientApp/lcov.info
        --target typescript
        --generated-dir src/RLDemo.Web/ClientApp/src
        --root .
        --out-format cobertura
        --out coverage-pg/pg.cobertura.xml

    - name: Upload frontend coverage
      if: always() && hashFiles('src/RLDemo.Web/ClientApp/coverage/ClientApp/cobertura-coverage.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        use-oidc: true
        files: |
          src/RLDemo.Web/ClientApp/coverage/ClientApp/cobertura-coverage.xml
        disable-search: true
        # The .pg report below is the last one, so it closes the build.
        finish: false
        fail-ci-if-error: false

    - name: Upload the .pg union coverage
      if: always() && hashFiles('coverage-pg/pg.cobertura.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        use-oidc: true
        files: |
          coverage-pg/pg.cobertura.xml
        disable-search: true
        # The last upload of the build closes it.
        finish: true
        fail-ci-if-error: false

    - name: Version the packages
      id: versioning
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@versioning-v1

    # With release lines on, the default branch tags nothing: a package with no tag yet would fail its
    # pack (MPV005). The release lines pack and publish; the default branch only when it released.
    - name: Decide whether this run publishes
      id: publishes
      env:
        RELEASED: ${{ steps.versioning.outputs.released }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && { [ -z "$RELEASED" ] || [ "$RELEASED" = "[]" ]; }; then
          echo "The default branch released nothing (release lines on, or no change): no pack, no publish."
          echo "value=false" >> "$GITHUB_OUTPUT"
        else
          echo "value=true" >> "$GITHUB_OUTPUT"
        fi

    # Only the five library projects are packable (IsPackable=false everywhere else).
    # No --no-build: the versions are decided after the tests, so pack builds again to stamp them into the
    # assemblies (--no-build also skips restore, which leaves the nuspec's dependency versions stale).
    # EnableSpaBuilder=false as in Build: the rebuild must not build the demo's Angular app.
    - name: Pack
      if: steps.publishes.outputs.value == 'true'
      run: dotnet pack --configuration Release -p:EnableSpaBuilder=false

    - name: Check the packages carry the released versions
      if: steps.publishes.outputs.value == 'true'
      id: packed-versions
      shell: bash
      env:
        VERSIONS: ${{ steps.versioning.outputs.versions }}
        DIST_TAGS: ${{ steps.versioning.outputs.dist-tags }}
      run: |
        # --skip-duplicate turns a pack at another version into "already exists" and a green run that published
        # nothing (#638): every released NuGet package must have been packed at the version it was released as.
        versions="${VERSIONS:-}"; [ -n "$versions" ] || versions='{}'
        npm="${DIST_TAGS:-}"; [ -n "$npm" ] || npm='{}'
        status=0
        while IFS=$'\t' read -r id version; do
          version="${version%$'\r'}"; [ -n "$id" ] || continue
          if [ -z "$(find . -iname "$id.$version.nupkg" -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "::error::$id was released as $version, but no $id.$version.nupkg was packed."
            status=1
          fi
        done < <(jq -r --argjson npm "$npm" 'to_entries[] | select(.key as $k | $npm | has($k) | not) | "\(.key)\t\(.value)"' <<< "$versions")
        exit $status

    # Trusted publishing: the job's GitHub OIDC token (id-token: write) is exchanged for a short-lived
    # nuget.org API key. The policy lives on nuget.org (owner MintPlayer, workflow build-master.yml,
    # packages MintPlayer.AI*); a package outside it is refused. `user` is the nuget.org profile that owns the policy.
    - name: NuGet login (trusted publishing)
      if: steps.publishes.outputs.value == 'true'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: Pieterjan

    - name: PushNuget
      if: steps.publishes.outputs.value == 'true'
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

    - name: PushGithub
      if: steps.publishes.outputs.value == 'true'
      run: dotnet nuget push **/*.nupkg --no-symbols --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}
